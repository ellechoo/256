<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>September 3rd — A Tunnel Through Time</title>
  <link rel="stylesheet" href="style-v2.css">
</head>
<body>
  <div id="mode-nav">
    <span id="mode-nav-text">Organize September 3 by</span>
    <div id="mode-switch">
      <span id="mode-switch-highlight" aria-hidden="true"></span>
      <button id="mode-switch-year" type="button" aria-pressed="true" disabled>Year</button>
      <button id="mode-switch-device" type="button" aria-pressed="false" disabled>Device</button>
    </div>
  </div>

  <div id="tunnel-viewport"><div id="tunnel-stage"></div></div>
  <div id="scroll-spacer"></div>
  <nav id="timeline" aria-label="Year timeline"></nav>

  <div id="flat-viewport" aria-hidden="true">
    <div id="flat-stage"></div>
  </div>

  <div id="photo-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-wrap">
      <button class="modal-nav modal-nav-prev" type="button" aria-label="Previous photo">&lsaquo;</button>
      <div class="modal-panel">
        <button class="modal-close" type="button" aria-label="Close">&times;</button>
        <div class="modal-left"><img class="modal-photo" alt=""></div>
        <div class="modal-right"><div class="modal-meta">
          <h2 class="meta-title"></h2>
          <dl class="meta-list">
            <div class="meta-row"><dt>Source</dt><dd data-field="photographer"></dd></div>
            <div class="meta-row"><dt>Date / time</dt><dd data-field="datetime"></dd></div>
            <div class="meta-row"><dt>Device</dt><dd data-field="device"></dd></div>
            <div class="meta-row"><dt>Location</dt><dd data-field="location"></dd></div>
          </dl>
          <div class="modal-swatches">
            <div class="swatch swatch-1"><span class="swatch-label"></span></div>
            <div class="swatch swatch-2"><span class="swatch-label"></span></div>
            <div class="swatch swatch-3"><span class="swatch-label"></span></div>
          </div>
        </div></div>
      </div>
      <button class="modal-nav modal-nav-next" type="button" aria-label="Next photo">&rsaquo;</button>
    </div>
  </div>

  <script src="script-v2.js"></script>
  <script src="flat-v2.js"></script>
  <script src="transition.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>September 3rd — A Tunnel Through Time</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

 <!-- Fixed viewport container — this is what the user actually sees. -->
  <div id="tunnel-viewport">
    <div id="tunnel-stage"></div>
  </div>

  <!-- Year label lives OUTSIDE the viewport so its z-index is not
       trapped inside the viewport's stacking context. -->
  <div id="year-label">
    <span id="year-label-text"></span>
  </div>

  <!-- This is the actual scrollable content. It has no visible content
       of its own — its height is what gives the user something to
       scroll through. One "screen height" of scroll per year (see
       CONFIG.vhPerYear in script.js). -->
  <div id="scroll-spacer"></div>

    <!-- Minimalist year rail. Dots are generated by script.js so the
       list stays in sync with data/dataset.json. -->
  <nav id="timeline" aria-label="Year timeline"></nav>



  <!-- Photo detail modal. Hidden by default (see .is-open in CSS). -->
  <div id="photo-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-backdrop"></div>

    <div class="modal-wrap">
      <button class="modal-nav modal-nav-prev" type="button" aria-label="Previous photo">&lsaquo;</button>

      <div class="modal-panel">
        <button class="modal-close" type="button" aria-label="Close">&times;</button>

        <div class="modal-left">
          <div class="hex-band hex-band-1"><span class="hex-label"></span></div>
          <div class="hex-band hex-band-2"><span class="hex-label"></span></div>
          <div class="hex-band hex-band-3"><span class="hex-label"></span></div>
          <img class="modal-photo" alt="">
        </div>

        <div class="modal-right">
          <div class="modal-meta">
            <h2 class="meta-title"></h2>
            <dl class="meta-list">
              <div class="meta-row"><dt>Photographer</dt><dd data-field="photographer"></dd></div>
              <div class="meta-row"><dt>Date / time</dt><dd data-field="datetime"></dd></div>
              <div class="meta-row"><dt>Device</dt><dd data-field="device"></dd></div>
              <div class="meta-row"><dt>Location</dt><dd data-field="location"></dd></div>
            </dl>
          </div>
        </div>
      </div>

      <button class="modal-nav modal-nav-next" type="button" aria-label="Next photo">&rsaquo;</button>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
